# =============================================================================
# GnuchanPurple - kitty colour scheme
# -----------------------------------------------------------------------------
# Copy to ~/.config/kitty/gnuchan-purple.conf, then in kitty.conf:
#
#   include gnuchan-purple.conf
#
# License: GPL3
# =============================================================================

# Base
background            #09030d
foreground            #ead7ff
selection_background  #542080
selection_foreground  #ffffff
cursor                #d8a4ff
cursor_text_color     #09030d
url_color             #c77dff

# Tab bar
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_background    #542080
active_tab_foreground    #ffffff
inactive_tab_background  #180a22
inactive_tab_foreground  #b78ed6
tab_bar_background       #09030d

# Window border. These three colours only paint anything when a border width
# is set - kitty draws no border at width 0, which is what this file used to
# leave it at, so the colours were dead settings. 1px matches the hairline
# frame the rest of the theme uses.
window_border_width    1px
active_border_color    #a855f7
inactive_border_color  #32143f
bell_border_color      #e879f9

# Normal colours
color0  #170a20
color8  #70458a
color1  #86198f
color9  #a21caf
color2  #6d28d9
color10 #7c3aed
color3  #9333ea
color11 #a855f7
color4  #9d4edd
color12 #b76eff
color5  #c77dff
color13 #d8a4ff
color6  #b57edc
color14 #c9a0ff
color7  #ead7ff
color15 #ffffff

# Marks
mark1_foreground #09030d
mark1_background #86198f
mark2_foreground #09030d
mark2_background #a855f7
mark3_foreground #09030d
mark3_background #c77dff
