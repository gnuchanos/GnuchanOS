; ============================================================================
; GnuchanPurple - polybar bar colours
; ----------------------------------------------------------------------------
; Either run polybar with this file (it is a complete minimal bar) or copy the
; [colors] section into your own bar config:
;
;   include-file = ~/.config/polybar/gnuchan-purple.ini
;
; License: GPL3
; ============================================================================

[colors]
background = #0e0614
background-alt = #180a22
foreground = #ead7ff
foreground-alt = #b78ed6
foreground-dim = #70458a
primary = #a855f7
secondary = #c77dff
accent = #9333ea
alert = #e879f9
border = #32143f
disabled = #32143f

[bar/gnuchan]
monitor =
width = 100%
height = 30
radius = 0
fixed-center = true
bottom = false
override-redirect = false
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}
border-size = 1
border-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "Sans:size=10;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;2"
font-2 = "Font Awesome 6 Free:style=Regular:size=10;2"
font-3 = "Font Awesome 6 Brands:style=Regular:size=10;2"

modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu battery

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-underline = ${colors.primary}
label-focused-padding = 2
label-focused-foreground = #ffffff
label-unfocused = %name%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.foreground-alt}
label-visible = %name%
label-visible-padding = 2
label-visible-foreground = ${colors.foreground}
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-urgent-foreground = #ffffff
label-separator = "|"
label-separator-padding = 1
label-separator-foreground = ${colors.border}

[module/date]
type = internal/date
interval = 30
date = "%d.%m.%Y"
time = "%H:%M"
label = %date% %time%
label-foreground = ${colors.foreground}
format-prefix = ""
format-prefix-foreground = ${colors.primary}
format-prefix-underline = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
label-foreground = ${colors.foreground-alt}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "mem "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%
label-foreground = ${colors.foreground-alt}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
label-volume = "vol %percentage%%"
label-volume-foreground = ${colors.foreground-alt}
label-muted = "vol muted"
label-muted-foreground = ${colors.foreground-dim}
bar-volume-width = 10
bar-volume-foreground-0 = ${colors.primary}
bar-volume-foreground-1 = ${colors.primary}
bar-volume-foreground-2 = ${colors.secondary}
bar-volume-foreground-3 = ${colors.secondary}
bar-volume-gradient = false
bar-volume-indicator = "|"
bar-volume-indicator-foreground = ${colors.foreground}
bar-volume-fill = "-"
bar-volume-empty = "-"
bar-volume-empty-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-charging-foreground = ${colors.foreground-alt}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground-alt}
ramp-capacity-0 = "="
ramp-capacity-1 = "="
ramp-capacity-2 = "="
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = "*"
animation-charging-1 = "**"
animation-charging-2 = "***"
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750
