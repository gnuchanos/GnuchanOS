# =============================================================================
# GnuchanPurple - i3 window manager colours
# -----------------------------------------------------------------------------
# Add to ~/.config/i3/config:
#
#   include ~/.config/gnuchan-purple/i3-colors.conf
#
# The include sets window colours, borders and gaps only, so your own layout
# and keybindings are untouched. Place it near the end of the file so it wins.
#
# Your bar is deliberately NOT touched. A "bar { }" block in an included file
# would add a second bar (i3 only merges blocks that share an "id") and would
# override your own status_command, position, height and mode. Copy the
# "colors { }" block at the bottom of this file into your existing bar block
# instead.
#
# License: GPL3
# =============================================================================

# class                 border    background  text      indicator  child_border
client.focused          #a855f7   #542080     #ffffff   #c77dff    #6d28d9
client.focused_inactive #32143f   #180a22     #b78ed6   #542080    #32143f
client.unfocused        #24102f   #0e0614     #b78ed6   #32143f    #24102f
client.urgent           #e879f9   #86198f     #ffffff   #e879f9    #a21caf
client.placeholder      #32143f   #09030d     #b78ed6   #32143f    #32143f
client.background       #09030d

# Window borders
default_border pixel 1
default_floating_border pixel 1
title_align center
focus_on_window_activation smart

# Gaps (1px hairline frame, matching the GTK title bars)
gaps inner 6
gaps outer 4
smart_gaps on
smart_borders on

# --- i3 bar colours ----------------------------------------------------------
# Copy the block below into your own "bar { }" block in ~/.config/i3/config.
# It is commented out here on purpose: see the note at the top of the file.
#
#   colors {
#       background #0e0614
#       statusline #b78ed6
#       separator  #32143f
#       focused_workspace   #542080 #542080 #ffffff
#       active_workspace    #180a22 #180a22 #ead7ff
#       inactive_workspace  #0e0614 #0e0614 #70458a
#       urgent_workspace    #86198f #86198f #ffffff
#       binding_mode        #a855f7 #a855f7 #ffffff
#   }
