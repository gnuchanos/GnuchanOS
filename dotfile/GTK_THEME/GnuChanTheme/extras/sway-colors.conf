# =============================================================================
# GnuchanPurple - Sway (Wayland) colours
# -----------------------------------------------------------------------------
# Add to ~/.config/sway/config:
#
#   include ~/.config/gnuchan-purple/sway-colors.conf
#
# Colours and gaps only, so your layout and keybindings are untouched.
#
# The "bar { }" block at the bottom is commented out on purpose: an included
# bar block defines a second bar and overrides your own position, height and
# status_command. Copy its "colors { }" section into your existing bar block
# instead. The same reasoning is spelled out in i3-colors.conf.
#
# License: GPL3
# =============================================================================

# class                 border    background  text      indicator  child_border
client.focused          #a855f7   #542080     #ffffff   #c77dff    #6d28d9
client.focused_inactive #32143f   #180a22     #b78ed6   #542080    #32143f
client.unfocused        #24102f   #0e0614     #b78ed6   #32143f    #24102f
client.urgent           #e879f9   #86198f     #ffffff   #e879f9    #a21caf
client.placeholder      #32143f   #09030d     #b78ed6   #32143f    #32143f

# Floating windows without decorations get the same hairline frame
default_border pixel 1
default_floating_border pixel 1
titlebar_border_thickness 1
font pango:Sans 10
title_align center

# Gaps
gaps inner 6
gaps outer 4
smart_gaps on
smart_borders on

# --- GTK theme for Sway ------------------------------------------------------
# "exec_always export ..." does NOT work: sway runs every exec in its own
# subshell, so the export dies with it and never reaches the session. Publish
# the variable to the session environment instead; these two lines cover
# systemd user services and D-Bus activated applications.
exec systemctl --user import-environment GTK_THEME
exec dbus-update-activation-environment --systemd GTK_THEME

# Those lines only publish a variable that is already set when sway starts.
# Set it from your login shell, for instance by adding this to ~/.profile, or
# write it as GTK_THEME=GnuchanPurple into ~/.config/environment.d/gtk.conf.
#
# The GTK 3 and GTK 4 settings.ini files the installer merges in cover most
# applications too, so this file is not enough on its own.

# --- Sway bar colours --------------------------------------------------------
# Copy the block below into your own "bar { }" block in ~/.config/sway/config.
# It is commented out here on purpose: see the note at the top of the file.
#
#   colors {
#       background #0e0614
#       statusline #b78ed6
#       separator  #32143f
#       focused_workspace   #542080 #542080 #ffffff
#       active_workspace    #180a22 #180a22 #ead7ff
#       inactive_workspace  #0e0614 #0e0614 #70458a
#       urgent_workspace    #86198f #86198f #ffffff
#       binding_mode        #a855f7 #a855f7 #ffffff
#   }
