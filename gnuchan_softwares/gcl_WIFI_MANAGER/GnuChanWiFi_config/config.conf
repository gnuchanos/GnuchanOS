# path ~/.config/GnuChanWiFi/config.conf
#
# GnuChanWiFi ayarlari. Bu dosya sade bir listedir:
#
#     Ad = deger
#
# `#` ile baslayan satir bir yorumdur. Bos satirlar ve bu programin bilmedigi
# adlar sessizce atlanir; dosyayi yazarken not birakmak icin kullanabilirsiniz.
# Bir deger tirnak icine alinabilir ("Wi-Fi") ya da alinmayabilir (Wi-Fi) —
# ikisi de ayni seydir.

# --------------------------------------------------------------- program

# Hangi nmcli calistirilsin. Bos birakilirsa PATH'teki "nmcli" kullanilir.
NmcliPath = "nmcli"

# Pencerenin ustundeki baslik.
Title = "Wi-Fi"

# ---------------------------------------------------------------- pencere

# Pencerenin genisligi (ekrana sigdirilir) ve ayni anda kac ag gosterilecegi.
FontFamily = "monospace"
FontSize = 14
Width = 520
Rows = 10

# ---------------------------------------------------------------- palet

# GnuChanWM, GnuChanRunner ve acilis ekraniyla ayni mor. Burada degistirirseniz
# yalnizca burasi degisir — bu pencere GnuChanWM'in dosyasini okumaz.
Background = "#1a0b2e"
Panel = "#32143f"
PanelEdge = "#7b2cbf"
Field = "#241033"
Text = "#e0c3fc"
TextMuted = "#9d7bba"
Accent = "#c77dff"

# Sifre gerektiren agin yanindaki kilit isaretinin rengi, ve bagli olan agin
# satirinin rengi.
Secured = "#ff9e64"
Connected = "#9ece6a"
