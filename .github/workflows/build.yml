name: GnuchanOS Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'language/**'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'language/**'
      - '.github/**'
  workflow_dispatch:      # elle tetikleme

# Her platform TAM pipeline (full) build eder:
#   gcl.exe (IDE + LSP + embed Lua/Python/Raylib)  ->  language/build/<os>/
#   python makefile.py   (parametre yok: tek komutta tüm build zinciri)
# Build ciktisi tek dosya zip/tar.gz olarak artifact'e yuklenir;
# v* tag push'larinda ayrica otomatik GitHub Release olusturulur.
jobs:
  build:
    name: full (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: gnulinux, os: ubuntu-24.04, py: python3 }
          - { platform: windows,  os: windows-2022, py: python }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3 python3-dev tar gzip \
            zlib1g-dev libffi-dev libssl-dev xorg-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev pkg-config

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # niXman mingw paketi: C:\ProgramData\mingw64\mingw64\bin
          # (gcc, mingw32-make, gendef, dlltool — hepsi burada)
          echo "C:\ProgramData\mingw64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install make -y --no-progress

      - name: Build full pipeline
        run: |
          cd language
          ${{ matrix.py }} makefile.py

      # Build çıktılarını DOĞRUDAN artifact olarak yükle.
      # (Ayrı zip üretmeyiz — GitHub Actions indirirken zaten otomatik zip yapar;
      #  ayrı zip üretirsek "zip içinde zip" olur.)
      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gcl-linux-build
          path: |
            language/build/gnuLinux/gcl
            language/build/gnuLinux/Library
            language/build/gnuLinux/Assets
            language/build/gnuLinux/Programs
          if-no-files-found: warn

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gcl-win-build
          path: |
            language/build/windows/gcl.exe
            language/build/windows/Library
            language/build/windows/Assets
            language/build/windows/Programs
          if-no-files-found: warn

  # v* tag push'larinda: tum platform build'lerinin paketlerini
  # GitHub Release'e ekler (otomatik release + asset'ler).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifact'lar direkt build çıktısı (dizinler). Bunlardan TEK gerçek
      # paket üret — GitHub'ın indirme sırasında yaptığı "dış zip" ile çakışmaz.
      - name: Package release
        shell: bash
        run: |
          set -e
          mkdir -p release
          # Artifact klasör adları build job'daki isimlerle AYNI olmalı:
          # gcl-linux-build / gcl-win-build. Çıktı paket adları farklı olsun
          # ki "aynı isimde zip içinde zip" oluşmasın.
          # Linux
          if [ -d artifacts/gcl-linux-build ]; then
            ( cd artifacts/gcl-linux-build && tar czf "$OLDPWD/release/gcl-linux-full.tar.gz" gcl Library Assets Programs 2>/dev/null || \
              ( cd artifacts/gcl-linux-build && tar czf "$OLDPWD/release/gcl-linux-full.tar.gz" gcl Library Assets ) )
          fi
          # Windows
          if [ -d artifacts/gcl-win-build ]; then
            ( cd artifacts/gcl-win-build && zip -r "$OLDPWD/release/gcl-win-full.zip" gcl.exe Library Assets Programs 2>/dev/null || \
              ( cd artifacts/gcl-win-build && zip -r "$OLDPWD/release/gcl-win-full.zip" gcl.exe Library Assets ) )
          fi
          ls -la release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            release/*.tar.gz release/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
